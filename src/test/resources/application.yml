spring:
  datasource:
    url: jdbc:h2:mem:dcuobot-test;MODE=MariaDB;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

census:
  base-url: https://census-test.dcuo.bot/s:test

scalar:
  path: /docs
  favicon: /favicon.ico
